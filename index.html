<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Management Dashboard</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Project CSS -->
  <link rel="stylesheet" href="assets/style.css">

  <!-- External libs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-light" id="body">

<div class="container py-4">

  <!-- Header + Theme Toggle -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 m-0">Asset Management Dashboard</h1>
    <button id="themeToggle" class="btn btn-secondary" type="button">🌙 Dark Mode</button>
  </div>

  <!-- Filters -->
  <div class="row mb-3 g-2 align-items-center">
    <div class="col-md-3">
      <select id="statusFilter" class="form-select" aria-label="Filter by status">
        <option value="">All Status</option>
        <option>Installed</option>
        <option>Spare</option>
        <option>Planned</option>
        <option>Available</option>
      </select>
    </div>

    <div class="col-md-3">
      <select id="circleFilter" class="form-select" aria-label="Filter by circle">
        <option value="">All Circles</option>
      </select>
    </div>

    <div class="col-md-3">
      <input id="searchBox" type="text" class="form-control" placeholder="Search Asset ID / Substation / Person" aria-label="Search">
    </div>

    <div class="col-md-3 text-end">
      <!-- Optional: add a global alert toggle here later -->
    </div>
  </div>

  <!-- Charts Section -->
  <div class="row my-4">
    <div class="col-md-6 mb-3">
      <div class="card h-100">
        <div class="card-body">
          <canvas id="statusChart" aria-label="Status chart"></canvas>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-3">
      <div class="card h-100">
        <div class="card-body">
          <canvas id="circleChart" aria-label="Circle chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Form -->
  <div class="card my-4">
    <div class="card-header bg-primary text-white">Add New Asset</div>
    <div class="card-body">
      <form id="entryForm" autocomplete="off" novalidate>
        <div class="row g-3">
          <div class="col-md-3">
            <input type="date" class="form-control" name="DATE" required>
          </div>

          <!-- Asset_ID as text to preserve leading zeros / long IDs -->
          <div class="col-md-3">
            <input type="text" class="form-control" name="Asset_ID" placeholder="Asset ID" required>
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" name="Material_Type" placeholder="Material Type">
          </div>

          <div class="col-md-3">
            <!-- Use underscore key to match CSV field Model_Variant used in JS -->
            <input type="text" class="form-control" name="Model_Variant" placeholder="Model/Variant">
          </div>

          <div class="col-md-3">
            <input type="number" class="form-control" name="NOS" placeholder="NOS">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" name="Circle" placeholder="Circle">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" name="Division" placeholder="Division">
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" name="Substation" placeholder="Substation">
          </div>

          <div class="col-md-3">
            <select name="Status" class="form-select">
              <option>Installed</option>
              <option>Spare</option>
              <option>Planned</option>
              <option>Available</option>
            </select>
          </div>

          <div class="col-md-3">
            <input type="text" class="form-control" name="Assigned_To" placeholder="Assigned To">
          </div>

          <div class="col-md-3">
            <input type="date" class="form-control" name="Planned_Date" placeholder="Planned Date">
          </div>

          <div class="col-md-3">
            <input type="date" class="form-control" name="Replacement_Date" placeholder="Replacement Date">
          </div>

          <div class="col-md-6">
            <input type="text" class="form-control" name="Remarks" placeholder="Remarks">
          </div>

          <div class="col-md-6">
            <input type="text" class="form-control" name="Last_Updated_By" placeholder="Updated By">
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-success" type="submit">Add Asset</button>
          <button class="btn btn-info" id="downloadCSV" type="button">Download Updated CSV</button>
          <label class="btn btn-outline-secondary mb-0">
            Import CSV
            <input id="importCSV" accept=".csv" type="file" hidden>
          </label>
        </div>
      </form>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-responsive mb-5">
    <table class="table table-bordered table-striped" id="assetTable">
      <thead class="table-dark">
        <tr>
          <th>DATE</th>
          <th>Asset_ID</th>
          <th>Material_Type</th>
          <th>Model_Variant</th>
          <th>NOS</th>
          <th>Circle</th>
          <th>Division</th>
          <th>Substation</th>
          <th>Status</th>
          <th>Assigned_To</th>
          <th>Planned_Date</th>
          <th>Replacement_Date</th>
          <th>Remarks</th>
          <th>Last_Updated_By</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Date Range Chart -->
  <div class="row mt-4 g-2 align-items-center">
    <div class="col-md-3"><input type="date" id="startDate" class="form-control" aria-label="Start date"></div>
    <div class="col-md-3"><input type="date" id="endDate" class="form-control" aria-label="End date"></div>
    <div class="col-md-3">
      <button id="rangeBtn" class="btn btn-info">Show Range Chart</button>
    </div>
  </div>

  <div class="mt-3">
    <canvas id="rangeChart"></canvas>
  </div>

</div>

<!-- Project JS (make sure path is correct) -->
<script src="assets/script.js"></script>
</body>
</html>
