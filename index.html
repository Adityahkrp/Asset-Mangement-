<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset Management Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-light" id="body">

<div class="container py-4">

    <!-- Header + Theme Toggle -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Asset Management Dashboard</h1>
        <button id="themeToggle" class="btn btn-secondary">🌙 Dark Mode</button>
    </div>

    <!-- Filters -->
    <div class="row mb-3">
        <div class="col-md-3">
            <select id="statusFilter" class="form-select">
                <option value="">All Status</option>
                <option>Installed</option>
                <option>Spare</option>
                <option>Planned</option>
                <option>Available</option>
            </select>
        </div>

        <div class="col-md-3">
            <select id="circleFilter" class="form-select">
                <option value="">All Circles</option>
            </select>
        </div>

        <div class="col-md-3">
            <input id="searchBox" type="text" class="form-control" placeholder="Search Asset ID / Substation / Person">
        </div>
    </div>

    <!-- Charts Section -->
    <div class="row my-4">
        <div class="col-md-6">
            <canvas id="statusChart"></canvas>
        </div>
        <div class="col-md-6">
            <canvas id="circleChart"></canvas>
        </div>
    </div>

    <!-- Entry Form -->
    <div class="card my-4">
        <div class="card-header bg-primary text-white">Add New Asset</div>
        <div class="card-body">
            <form id="entryForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="date" class="form-control" name="DATE" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="Asset_ID" placeholder="Asset ID" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Material_Type" placeholder="Material Type">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Model_Variant" placeholder="Model">
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="NOS" placeholder="NOS">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Circle" placeholder="Circle">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Division" placeholder="Division">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Substation" placeholder="Substation">
                    </div>
                    <div class="col-md-3">
                        <select name="Status" class="form-select">
                            <option>Installed</option>
                            <option>Spare</option>
                            <option>Planned</option>
                            <option>Available</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" name="Assigned_To" placeholder="Assigned To">
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control" name="Planned_Date">
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control" name="Replacement_Date">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="Remarks" placeholder="Remarks">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" name="Last_Updated_By" placeholder="Updated By">
                    </div>
                </div>

                <button class="btn btn-success mt-3" type="submit">Add Asset</button>
                <button class="btn btn-info mt-3" id="downloadCSV" type="button">Download Updated CSV</button>
            </form>

            <!-- CSV Import -->
            <div class="mt-3">
                <input type="file" id="importCSV" accept=".csv" class="form-control">
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive mb-5">
        <table class="table table-bordered table-striped" id="assetTable">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Asset ID</th>
                    <th>Material Type</th>
                    <th>Model/Variant</th>
                    <th>NOS</th>
                    <th>Circle</th>
                    <th>Division</th>
                    <th>Substation</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Planned Date</th>
                    <th>Replacement Date</th>
                    <th>Remarks</th>
                    <th>Updated By</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Date Range Chart -->
    <div class="row mt-4">
        <div class="col-md-3"><input type="date" id="startDate" class="form-control"></div>
        <div class="col-md-3"><input type="date" id="endDate" class="form-control"></div>
        <div class="col-md-3">
            <button id="rangeBtn" class="btn btn-info">Show Range Chart</button>
        </div>
    </div>
    <canvas id="rangeChart" class="mt-4"></canvas>

</div>

<script src="assets/script.js"></script>
</body>
</html>
