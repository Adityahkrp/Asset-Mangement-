<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Asset Management</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
  <div id="header-placeholder"></div>

  <main class="container py-4">
    <h1 class="h3">Asset Management — Dashboard</h1>

    <div class="row my-4">
      <div class="col-md-6"><div class="card"><div class="card-body"><canvas id="statusChart"></canvas></div></div></div>
      <div class="col-md-6"><div class="card"><div class="card-body"><canvas id="circleChart"></canvas></div></div></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- load stable, pinned libs before your script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="../assets/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      includePartial('../partials/header.html', '#header-placeholder');
      includePartial('../partials/footer.html', '#footer-placeholder');
      if (typeof initDashboard === 'function') initDashboard();
    });
  </script>
</body>
</html>
