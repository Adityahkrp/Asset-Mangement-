<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Asset — Asset Management</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container py-4">
    <h2 class="h5">Add New Asset</h2>
    <form id="entryForm" novalidate>
      <!-- prefer ids for JS access -->
      <div class="row g-3">
        <div class="col-md-3"><input id="date" name="DATE" type="date" class="form-control" required></div>
        <div class="col-md-3"><input id="assetId" name="Asset_ID" type="text" class="form-control" placeholder="Asset ID" required></div>
        <div class="col-md-3"><input id="material" name="Material_Type" type="text" class="form-control" placeholder="Material Type"></div>
        <div class="col-md-3"><input id="model" name="Model_Variant" type="text" class="form-control" placeholder="Model/Variant"></div>
        <!-- more fields here -->
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-success">Add Asset</button>
      </div>
    </form>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      includePartial('../partials/header.html', '#header-placeholder');
      includePartial('../partials/footer.html', '#footer-placeholder');
      if (typeof initAddAssetPage === 'function') initAddAssetPage();
    });
  </script>
</body>
</html>
